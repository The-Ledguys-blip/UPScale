name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Inno Setup 6
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress
        "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Verify Windows build environment
      shell: pwsh
      run: |
        python --version
        python -c "import sys, importlib.util; print(sys.executable); print(sys.platform); print(importlib.util.find_spec('PyInstaller')); print(importlib.util.find_spec('PySide6'))"
        Get-ChildItem app.py, app.ico, led-pixelmap-tool_121.html | Format-Table Name,Length
        if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") { "ISCC.exe gevonden" } else { "ISCC.exe ONTBREEKT" }

    - name: Build exe, portable zip and installer
      shell: pwsh
      run: python build_app_windows.py zip installer

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: UPScale-Windows
        path: |
          dist/UPScale-*-win64.zip
          installer_output/UPScale-Setup-*.exe

    - name: Upload to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/UPScale-*-win64.zip
          installer_output/UPScale-Setup-*.exe
        fail_on_unmatched_files: true
